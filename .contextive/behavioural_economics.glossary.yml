  - name: The Cobra Effect
    definition: A specific manifestation of perverse incentives where an attempted
      solution to a problem makes the problem worse. Originates from a colonial anecdote
      where a bounty for dead cobras led people to breed them for profit.
    aliases:
    - Perverse Incentives
    - incentive failure
    examples:
    - 'See: [The Cobra Effect](https://en.wikipedia.org/wiki/Perverse_incentive#The_Cobra_Effect)
      for more details.'
