  terms:
  - name: Blade servers
    definition: 'A single chassis with multiple processor boards, I/O boards, and
      networking boards.

      Each processor board boots independently and runs its own operating system.'
  - name: CPU registers
    definition: 'Registers are special purpose physical memory used during runtime
      execution of instruction sets. These registers are usually optimized for their

      dedicated task. These registers vary in number and type, depending on the computer
      architecture. They include `accumulators`, `index registers`, `stack pointers`,

      and general-purpose registers,

      plus any condition-code information (e.g. status codes). Along with the program
      counter, the content of these registers must be saved when an

      interrupt occurs, to allow the process to be continued correctly afterward.'
    aliases:
    - registry
