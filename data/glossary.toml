A goal-setting framework used to align individual and team efforts with broader organisational priorities.
Each Objective defines a qualitative direction or ambition, while its associated Key Results describe specific, measurable outcomes used to track progress.
OKRs encourage transparency, focus, and outcome-driven planning across all levels of an organisation.
"""
aliases = ["OKRs", "goal alignment framework", "outcome tracking"]
references = [
    { title = "What are Objectives and Key Results (OKRs)?", link = "https://www.ibm.com/think/topics/okrs" },
    { title = "Measure What Matters", author = "John Doerr", year = "2017", link="https://www.goodreads.com/book/show/39286958-measure-what-matters" }
]

[[terminology]]
name = "Goodhart's Law"
abbreviation = ""
domain = "metrics and decision-making"
description = """
A principle stating that when a metric is used as a target for decision-making, it tends to lose its effectiveness as a measure. Once people begin optimising for the metric itself, they may distort behaviour in ways that undermine the original goal.
"""
aliases = ["metric manipulation", "KPI dysfunction"]
references = [
    { title = "Goodhart's Law", link = "https://en.wikipedia.org/wiki/Goodhart%27s_law" }
]

[[terminology]]
name = "The Cobra Effect"
abbreviation = ""
domain = "behavioural economics"
description = """
A specific manifestation of perverse incentives where an attempted solution to a problem makes the problem worse. Originates from a colonial anecdote where a bounty for dead cobras led people to breed them for profit.
"""
aliases = ["Perverse Incentives", "incentive failure"]
references = [
    { title = "The Cobra Effect", link = "https://en.wikipedia.org/wiki/Perverse_incentive#The_Cobra_Effect" }
]

[[terminology]]
name = "Confirmation Bias"
abbreviation = ""
domain = "cognitive psychology"
description = """
The human tendency to seek, interpret, and recall information in ways that confirm pre-existing beliefs or hypotheses. In impact reporting, this can lead to selectively framing results to appear more favourable than they are.
"""
aliases = ["selective reasoning", "motivated reasoning"]
references = [
    { title = "Confirmation Bias", link = "https://en.wikipedia.org/wiki/Confirmation_bias" }
]

[[terminology]]
name = "metrics"
abbreviation = ""
domain = "Measurement & Evaluation"
description = """
Quantitative indicators used to track performance, progress, or system behavior. While metrics can support decision-making and alignment, they often become counterproductive when used as proxies for complex goals — particularly when incentives or evaluation criteria are tied too closely to them (see Goodhart’s Law).
"""
aliases = ["quantitative indicators", "performance metrics"]
references = [
]

[[terminology]]
name = "mentorship"
abbreviation = ""
domain = "Professional Growth"
description = """
A developmental relationship in which a more experienced individual supports the learning, confidence, and capability-building of a less experienced peer. Mentorship can be formal or informal and often includes guidance, encouragement, and honest reflection. It plays a key role in skill development, knowledge transfer, and shaping professional identity.
"""
aliases = ["mentoring", "coaching relationship"]
references = [
]

[[terminology]]
name = "conflict"
abbreviation = ""
domain = "Collaboration & Communication"
description = """
A state of tension or disagreement between individuals or groups, often arising from misaligned goals, values, or interpretations. Conflict is not inherently negative; when handled constructively, it can surface important issues, improve decisions, and build trust. Effective conflict resolution involves curiosity, structured dialogue, and a shared commitment to progress.
"""
aliases = ["disagreement", "tension", "interpersonal conflict"]
references = [
]

[[terminology]]
name = "feedback culture"
abbreviation = ""
domain = "Collaboration & Communication"
description = """
A shared team or organizational norm that encourages timely, constructive, and reciprocal feedback. A strong feedback culture supports psychological safety, continuous improvement, and personal growth. It balances honesty with care and treats feedback as a regular practice — not just a performance tool.
"""
aliases = ["feedback loop", "constructive feedback", "feedback environment"]
references = [
    { title = "Radical Candor by Kim Scott", link = "https://www.radicalcandor.com/" }
]

[[terminology]]
name = "Team Dynamics"
abbreviation = ""
domain = "collaboration"
description = """
The patterns of interaction, behavior, and influence between members of a team.
Team dynamics shape how work is done, how decisions are made, and how conflict or collaboration unfold over time.
Healthy dynamics foster trust, psychological safety, and effective coordination --- while toxic dynamics can lead to misalignment,
disengagement, or performance breakdowns.
"""
aliases = ["group behavior", "team interaction patterns", "collaborative dynamics", "team culture"]
references = [
    { title = "Team of Teams", author = "McChrystal, S.", year = "2015", link = "https://www.goodreads.com/book/show/22529127-team-of-teams" },
    { title = "The Five Dysfunctions of a Team", author = "Lencioni, P.", year = "2002", link = "https://www.goodreads.com/book/show/21343.The_Five_Dysfunctions_of_a_Team" },
    { title = "The Dream Team Nightmare", author = "Tung, P.", year = "2013", link = "https://pragprog.com/titles/ptdream/the-dream-team-nightmare/" }
]

[[terminology]]
name = "Congruence"
abbreviation = ""
domain = "self-awareness"
description = """
The alignment between a person’s internal values, beliefs, and emotions, and their external behavior, language, or decisions.
In team and leadership contexts, congruence builds trust by demonstrating integrity and coherence.
A congruent person is perceived as authentic. They __“walk their talk”__ and act in ways that reflect what they truly believe.
"""
aliases = ["authenticity", "alignment", "integrity"]
references = [
    { title = "On Becoming a Person", author = "Rogers, C.", year = "1961", link = "https://www.goodreads.com/book/show/174879.On_Becoming_a_Person" },
    { title = "Dare to Lead", author = "Brown, B.", year = "2018", link = "https://www.goodreads.com/book/show/40109367-dare-to-lead" },
    { title = "The 8th Habit: From Effectiveness to Greatness", author = "Covey, S. R.", year = "2010", link = "https://www.goodreads.com/book/show/14596922" },
    { title = "Behind Closed Doors", author = "Rothman, J.", year = "2005", link = "https://www.goodreads.com/book/show/4100.Behind_Closed_Doors" }
]

[[terminology]]
name = "Conversation"
abbreviation = ""
domain = "communication"
description = """
A conversation is an interactive exchange where people share information, perspectives, and emotions in real time. High-quality conversations balance speaking and listening so all parties feel heard and can co-create new understanding.
"""
aliases = ["dialogue", "discussion"]
references = []

[[terminology]]
name = "Emotional Intelligence"
abbreviation = ""
domain = "personal development"
description = """
Emotional intelligence is the capacity to recognise, understand, and manage your own emotions while responding effectively to the emotions of others. It blends self-awareness, empathy, and regulation to maintain constructive relationships under pressure.
"""
aliases = ["EQ", "emotional maturity"]
references = []

[[terminology]]
name = "Empathy"
abbreviation = ""
domain = "communication"
description = """
Empathy is the ability to perceive and appreciate another person’s feelings, experiences, or perspectives. It requires curiosity and presence, going beyond sympathy to connect with what someone else may be living through.
"""
aliases = ["compassionate understanding"]
references = []

[[terminology]]
name = "Elegance"
abbreviation = ""
domain = "software development"
description = """
Elegance describes solutions that deliver the required outcome with minimal complexity. Elegant code favours clarity, proportion, and purpose so future contributors can understand and extend it quickly.
"""
aliases = ["simplicity", "graceful design"]
references = []

[[terminology]]
name = "Goals"
abbreviation = ""
domain = "productivity"
description = """
Goals express the outcomes a person or team intends to achieve. Good goals clarify scope, success measures, and time horizons so effort can be coordinated and progress evaluated.
"""
aliases = ["objectives", "targets"]
references = []

[[terminology]]
name = "Interviewing"
abbreviation = ""
domain = "talent acquisition"
description = """
Interviewing is a structured conversation where an organisation explores a candidate’s experience, judgement, and fit. Effective interviewing combines preparation, open questions, and evidence-based evaluation to reduce bias.
"""
aliases = ["candidate interviewing"]
references = []

[[terminology]]
name = "Assessments"
abbreviation = ""
domain = "talent acquisition"
description = """
Assessments evaluate a person’s skills, behaviours, or potential against defined criteria. They range from interviews and simulations to written tests, providing comparable data to support hiring or development decisions.
"""
aliases = ["candidate assessments", "evaluation exercises"]
references = []

[[terminology]]
name = "Programming"
abbreviation = ""
domain = "software development"
description = """
Programming is the act of designing and implementing instructions a computer can execute. It blends problem decomposition, abstraction, and tooling to turn ideas into working software.
"""
aliases = ["software development"]
references = []

[[terminology]]
name = "Readability"
abbreviation = ""
domain = "software development"
description = """
Readability describes how easily other people can follow a piece of code or documentation. High readability reduces cognitive load, shortens reviews, and lowers the risk of bugs when changes are made.
"""
aliases = ["code clarity"]
references = []

[[terminology]]
name = "Testing"
abbreviation = ""
domain = "quality assurance"
description = """
Testing exercises a system to discover whether it behaves as intended, exposes defects, or regresses after change. Effective testing blends automation and exploration to build confidence in releases.
"""
aliases = ["quality testing", "software testing"]
references = []

[[terminology]]
name = "Reflection"
abbreviation = ""
domain = "personal development"
description = """
Reflection is the deliberate act of reviewing experiences to extract insight, validate assumptions, and adapt future behaviour. Regular reflection strengthens learning loops and clarifies priorities.
"""
aliases = ["self-reflection", "introspection"]
references = []

[[terminology]]
name = "Organizing"
abbreviation = ""
domain = "productivity"
description = """
Organizing arranges commitments, information, and resources so work can advance without friction. It turns scattered intentions into structured plans people can act on.
"""
aliases = ["organisation", "arranging work"]
references = []

[[terminology]]
name = "Task Management"
abbreviation = ""
domain = "productivity"
description = """
Task management is the practice of capturing, prioritising, and tracking work items from idea to completion. It ensures focus stays on the right commitments and makes progress observable.
"""
aliases = ["task tracking"]
references = []

[[terminology]]
name = "Time Management"
abbreviation = ""
domain = "productivity"
description = """
Time management coordinates activities within the limited hours available. It blends planning, scheduling, and boundary-setting so important work receives the attention it deserves.
"""
aliases = ["calendar management"]
references = []

[[terminology]]
name = "Workflow"
abbreviation = ""
domain = "process design"
description = """
A workflow is the sequence of steps that transforms input into outcome. Mapping workflows clarifies hand-offs, reveals bottlenecks, and guides improvement.
"""
aliases = ["process flow"]
references = []

[[terminology]]
name = "Design"
abbreviation = ""
domain = "software development"
description = """
Design decides how parts of a system fit together to solve a problem within given constraints. Good design balances clarity, flexibility, and cost so the system remains understandable when change arrives.
"""
aliases = ["system design"]
references = []

[[terminology]]
name = "Architecture"
abbreviation = ""
domain = "software development"
description = """
Architecture defines the high-level structure and guiding principles of a system. It spotlights the decisions that are hard to reverse and communicates how components collaborate to deliver value.
"""
aliases = ["software architecture"]
references = []

[[terminology]]
name = "Adaptability"
abbreviation = ""
domain = "strategy"
description = """
Adaptability is the capability to adjust plans, systems, or behaviour when conditions shift. Organisations cultivate adaptability to stay resilient in the face of new information or constraints.
"""
aliases = ["flexibility", "resilience"]
references = []

[[terminology]]
name = "Pivotting"
abbreviation = ""
domain = "strategy"
description = """
Pivotting is the deliberate act of changing direction when emerging evidence shows the current trajectory will not deliver the desired outcome. It keeps investments aligned with reality instead of sunk-cost momentum.
"""
aliases = ["course correction", "strategic pivot"]
references = []

[[terminology]]
name = "Relationships"
abbreviation = ""
domain = "collaboration"
description = """
Relationships capture the ongoing connections between people or groups. Healthy relationships feature trust, dependable communication, and mutual benefit; fragile ones show misalignment or low psychological safety.
"""
aliases = ["working relationships", "partnerships"]
references = []

[[terminology]]
name = "Interpersonal Skills"
abbreviation = ""
domain = "collaboration"
description = """
Interpersonal skills are the behaviours and techniques that enable people to build rapport, coordinate work, and resolve friction. They include active listening, feedback, and the conscious use of tone and body language.
"""
aliases = ["people skills", "soft skills"]
references = []

[[terminology]]
name = "Self-actualization"
abbreviation = ""
domain = "personal development"
description = """
The process of realising and expressing one's full potential, talents, and creativity. Often considered the highest level of psychological development, self-actualization occurs when basic needs have been met and individuals pursue purpose, meaning, and personal growth. Associated with autonomy, authenticity, and intrinsic motivation.
"""
aliases = ["self-fulfilment", "personal growth", "realising potential"]
references = [
    { title = "Maslow’s Hierarchy of Needs", link = "https://en.wikipedia.org/wiki/Maslow%27s_hierarchy_of_needs" }
]

[[terminology]]
name = "KISS"
abbreviation = ""
domain = "software development"
description = """
KISS stands for “Keep It Simple, Stupid” — a design principle that encourages building the simplest solution that fulfils the requirement. It reminds teams that unnecessary complexity rarely pays off.
"""
aliases = ["Keep It Simple"]
references = []

[[terminology]]
name = "Understanding"
abbreviation = ""
domain = "communication"
description = """
Understanding is the mental process of accurately grasping the meaning, intent, or significance of information shared by others. It demands attention, context, and clarification so that what is heard aligns with what was meant.
"""
aliases = ["comprehension", "grasp"]
references = []

[[terminology]]
name = "YAGNI"
abbreviation = ""
domain = "software development"
description = """
YAGNI — “You Aren’t Gonna Need It” — cautions developers against implementing capabilities before they are required. It keeps focus on current needs to avoid wasted effort and latent defects.
"""
aliases = []
references = []

[[terminology]]
name = "Zibaldone"
abbreviation = ""
domain = "knowledge management"
description = """
An eclectic personal notebook or commonplace book used to collect thoughts, quotes, observations, and ideas. Originating from the Italian word for “heap of things,” a zibaldone is a private, unstructured record of personal knowledge — often used as a thinking aid, reference archive, or creative incubator.
"""
aliases = ["commonplace book", "idea journal", "thinking notebook"]
references = [
    { title = "Zibaldone", author="Various Contributors", site="Wikipedia", year="2025", link = "https://en.wikipedia.org/wiki/Zibaldone" }
]

[[terminology]]
name = "Myers–Briggs Type Indicator"
abbreviation = "MBTI"
domain = "personality psychology"
description = """
A psychological framework based on Carl Jung's theories of personality types, categorising individuals along four dimensions: Extraversion–Introversion, Sensing–Intuition, Thinking–Feeling, and Judging–Perceiving.
The resulting 16 personality types aim to describe cognitive preferences and behavioural tendencies. Often used in team building, coaching, and self-awareness contexts --- though its scientific validity is unconfirmed.

**Use with caution!** While the theory is widely popular, it can be dangerous to use it as a definitive measure of personality. Personality indicators are best used as a tool for self-reflection and understanding, rather than as a rigid classification system.
"""
aliases = ["MBTI", "Jungian personality types", "Myers-Briggs"]
references = [
    { title = "MBTI", author="Various Contributors", site="Wikipedia", year="2025", link = "https://en.wikipedia.org/wiki/Myers%E2%80%93Briggs_Type_Indicator" },
    { title = "16 Personalities Test", author="Analytics Limited", site="16 Personalities", year="2025", link = "https://www.16personalities.com/" },
    { title = "Take the MBTI® Instrument", year="2018", site="Myers & Briggs Foundation", link = "https://www.myersbriggs.org/my-mbti-personality-type/take-the-mbti-instrument/" },
    { title="How thousands of companies ended up using a bogus psychology test on their staff", author="Edwards, J.", year="2022", site="The Independant", link="https://www.independent.co.uk/voices/myers-briggs-psychology-test-garbage-b2200663.html"},
    { title="What You Don't Know about This Personality Test Can Hurt You ", author="Whitbourne, S. K.", year="2014", site="Psychology Today", link="https://www.psychologytoday.com/us/blog/fulfillment-at-any-age/201401/what-you-dont-know-about-this-personality-test-can-hurt-you"},
    { title="DISC Assessment", author="Various Contributors", year="2014", site="Wikipedia", link="https://en.wikipedia.org/wiki/DISC_assessment"}
]

[[terminology]]
name = "Maslow’s hierarchy of needs"
abbreviation = ""
domain = "psychology"
description = """
A motivational theory proposing that human needs are structured in a five-level hierarchy: physiological needs, safety, love and belonging, esteem, and self-actualization. The theory suggests that basic needs must be met before individuals can pursue higher-level psychological growth and fulfilment. Often used in education, coaching, and workplace wellbeing.
"""
aliases = ["Maslow’s pyramid", "needs hierarchy", "human motivation"]
references = [
    { title = "A Theory of Human Motivation", author = "Maslow, A.H.", year = "1943", link = "https://psychclassics.yorku.ca/Maslow/motivation.htm" },
    { title = "Maslow’s Hierarchy of Needs", year="2014", author="Various Contributors", site="Wikipedia", link = "https://en.wikipedia.org/wiki/Maslow%27s_hierarchy_of_needs" }
]

[[terminology]]
name = "Barnum Effect"
abbreviation = ""
domain = "cognitive psychology"
description = """
A cognitive bias in which individuals believe vague, general statements about personality are highly accurate for them personally. Often exploited by horoscopes, personality tests, and pseudoscientific diagnostics, the Barnum Effect explains why people perceive such feedback as insightful even when it applies to most others.
"""
aliases = ["Forer Effect", "subjective validation"]
references = [
    { title = "The Barnum Effect", author="Various Contributors", site="Wikipedia", link = "https://en.wikipedia.org/wiki/Barnum_effect" },
    { title = "The Fallacy of Personal Validation: A Classroom Demonstration of Gullibility", author="Forer, B. R.", site="APA PsycNet", year="1943", link = "https://psycnet.apa.org/doiLanding?doi=10.1037%2Fh0059240" }
]

[[terminology]]
name = "Cognitive agency"
abbreviation = ""
domain = "cognitive science"
description = """
The capacity of a person or system to perceive, interpret, and act based on knowledge, goals, and intent. In humans, cognitive agency involves self-directed reasoning, planning, and decision-making. In organizational or AI contexts, it refers to the ability to independently pursue objectives with adaptive intelligence.
"""
aliases = ["mental autonomy", "reasoning agency"]
references = [
    { title = "Agency in Cognitive Science", author="Various Contributors", site="Wikipedia", link = "https://en.wikipedia.org/wiki/Agency_(philosophy)" },
    { title = "What Is Agency?", site = "Stanford Encyclopedia of Philosophy", author="Schlosser, M.", year="2015", link = "https://plato.stanford.edu/entries/agency/" }
]

[[terminology]]
name = "Labeling Bias"
abbreviation = ""
domain = "social psychology"
description = """
The tendency for people’s behavior or identity to be interpreted through the lens of an assigned label, often reinforcing stereotypes and limiting individual growth. Labeling bias can reduce cognitive agency by constraining how others perceive and interact with the labeled person — regardless of nuance or change.
"""
aliases = ["stereotype reinforcement", "identity bias"]
references = [
    { title = "Labeling Theory",author="Various Contributors", site="Wikipedia",  link = "https://en.wikipedia.org/wiki/Labeling_theory" }
]

[[terminology]]
name = "Cold Reading"
abbreviation = ""
domain = "communication psychology"
description = """
A technique used to make high-probability guesses about someone’s background or personality without prior knowledge, often by observing cues and using general statements. Common in pseudoscience and performance (e.g. psychics, mediums), cold reading exploits confirmation bias and the Barnum Effect to appear insightful or prophetic.
"""
aliases = ["psychic reading", "persuasive guessing"]
references = [
    { title = "Cold Reading", author="Various Contributors", site="Wikipedia",  link = "https://en.wikipedia.org/wiki/Cold_reading" }
]

[[terminology]]
name = "Big Five Personality Traits"
abbreviation = ""
domain = "psychology"
description = """
A widely accepted model in personality psychology that describes human personality through five broad dimensions:
Openness, Conscientiousness, Extraversion, Agreeableness, and Neuroticism (OCEAN). Unlike many typologies, the Big Five is based on empirical research and sees traits as spectrums rather than categories.
"""
aliases = ["OCEAN model", "Five Factor Model"]
references = [
    { title = "Big Five Personality Traits", link = "https://en.wikipedia.org/wiki/Big_Five_personality_traits" }
]

[[terminology]]
name = "HEXACO Personality Model"
abbreviation = ""
domain = "psychology"
description = """
An extension of the Big Five model that adds a sixth factor: Honesty-Humility. The HEXACO model captures traits across six domains: Honesty-Humility, Emotionality, eXtraversion, Agreeableness, Conscientiousness, and Openness. It emphasizes ethical behavior and social deviance more explicitly than OCEAN-based models.
"""
aliases = ["six-factor personality model"]
references = [
    { title = "HEXACO Personality Inventory", link = "https://hexaco.org/" }
]

[[terminology]]
name = "Nonviolent Communication"
abbreviation = "NVC"
domain = "communication"
description = """
A structured approach to communication developed by Marshall Rosenberg that fosters empathy, mutual understanding, and conflict resolution.
NVC separates observation from judgment, expresses feelings and needs, and makes clear, respectful requests, rather than demands or accusations.
"""
aliases = ["NVC", "compassionate communication"]
references = [
    { title = "Nonviolent Communication: A Language of Life", author = "Marshall B. Rosenberg", year = "2003", link = "https://www.goodreads.com/book/show/71730.Nonviolent_Communication" },
    { title = "Center for Nonviolent Communication", link = "https://www.cnvc.org/" }
]

[[terminology]]
name = "Placating"
abbreviation = ""
domain = "communication dynamics"
description = """
A conflict-avoidant behavior where someone attempts to appease others or defuse tension by agreeing, apologizing, or giving in; often at the cost of their own needs or honesty.
Placating can appear kind but may undermine trust, clarity, or long-term collaboration when used manipulatively or habitually.
"""
aliases = ["appeasement", "passive compliance"]
references = []

[[terminology]]
name = "Manipulation"
abbreviation = ""
domain = "interpersonal behavior"
description = """
The use of indirect, deceptive, or coercive tactics to influence another person’s behavior, often serving the manipulator’s interests while masking intent.
Manipulation may include guilt-tripping, gaslighting, passive-aggressive behavior, or selective omission --- and typically exploits emotional or relational dynamics.
"""
aliases = ["emotional control", "covert influence"]
references = []

[[terminology]]
name = "Gamification"
abbreviation = ""
domain = "learning"
description = """
Applying game design elements such as points, challenges, or levels to non-game contexts to encourage engagement, sustained motivation, and iterative progress.
In teams, gamification can make routine work feel purposeful by rewarding experimentation and visible wins.
"""
aliases = ["game-based motivation"]
references = [
    { title = "Actionable Gamification by Yu-kai Chou", link = "https://yukaichou.com/gamification-examples/octalysis-complete-gamification-framework/" },
    { title = "Gamification at Work", link = "https://hbr.org/2014/02/how-gamification-motivates-people" }
]

[[terminology]]
name = "Team morale"
abbreviation = ""
domain = "collaboration"
description = """
The collective emotional state, motivation, and confidence of a team when pursuing shared goals.
High morale amplifies engagement, resilience, and willingness to support one another, while low morale erodes focus and productivity.
"""
aliases = ["collective spirit", "group morale"]
references = [
    { title = "The Importance of Team Morale", link = "https://www.apa.org/news/press/releases/2022/05/workplace-well-being" },
    { title = "Boosting Team Morale", link = "https://www.mckinsey.com/capabilities/people-and-organizational-performance/our-insights/rewiring-leadership-development" }
]
