title: Pragmatic Penguin Patterns
baseURL: "localhost:1313"

module:
  imports:
    path: github.com/StefMa/hugo-fresh

assetDir: "assets"
enableRobotsTXT: true

pagination:
  pagerSize: 5
canonifyURLs: true

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
  page:
    - HTML
  taxonomy:
    - HTML
  term:
    - HTML

# Disables warnings
markup:
  defaultMarkdownHandler: goldmark
  highlight:
    codeFences: true
    noClasses: true
    lineNos: false
    style: catppuccin-frappe
    guessSyntax: true
    tabWidth: 2
  goldmark:
    extensions:
      footnote: true
    renderer:
      unsafe: true # Allows you to write raw html in your md files

taxonomies:
  category: "categories"
  tag: "tags"
  level: "levels"

params:
  dataDir: /data
  # Open graph allows easy social sharing. If you don't want it you can set it to false or just delete the variable
  openGraph: true
  # Used as meta data; describe your site to make Google Bots happy
  description: Explore practical techniques, decision frameworks, concepts, and mindset shifts tailored for thoughtful professionals, knowledge workers, and teams.
  # Preloader ensures images are loaded before displaying to the user. If you don't want it uncomment to set it to false
  # preloader: false
  navbarlogo:
  # Logo (from static/images/logos/___)
    image: logos/ppp_logo.webp
    link: "/"
    width: 112
    height: 28
  font:
    name: "Open Sans"
    sizes: [400,600]
  author:
    name: Stijn Dejongh
    email: stijn@sddevelopment.be
  hero:
    # Main hero title
    title: Pragmatic Penguin Patterns
    # Hero subtitle (optional)
    subtitle: A practical knowledge base for technical professionals who value context over commandments
    # Button text
    buttontext: Explore the Library
    # Where the main hero button links to
    buttonlink: "#introduction"
    # Hero image (from static/images/___)
    image: pattern_portfolio.svg
    # Footer logos (from static/images/logos/clients/*.svg)
    # urls are optional
    clientlogos:
  comments:
    repo: 'sddevelopment-be/penguin-pragmatic-patterns'
    repoId: 'MDEwOlJlcG9zaXRvcnkzMzg3NjE5NDE='
    category: 'Pattern Comments'
    categoryId: 'DIC_kwDOFDEY1c4CBILi'
    theme: 'light'

  # Customizable navbar. For a dropdown, add a "sublinks" list.
  navbar:
  - title: Concepts
    url: /concepts/
  - title: Practices
    url: /practices/
  - title: Primers
    url: /primers/
  - title: Resources
    sublinks:
      - title: Glossary
        url: /glossary/
      - title: Bibliography
        url: /books
      - title: "Tools, Websites, Apps"
        url: /tools/
      - title: "Slidedecks"
        url: /presentations/
  - title: Admin
    sublinks:
      - title: Helping Out
        url: /contributing/
      - title: Change Log
        url: /changelog/
      - title: License
        url: /license/

  section1:
    title: Why this exists
    subtitle: because knowing what to do matters less than knowing when to do it
    text: >
      You've probably encountered an elegant solution to a problem and thought: "Why didn't I see that sooner?" The reason is simpler than you'd expect: you simply didn't know it was an option. Maybe someone mentioned the approach once, but the context got lost in translation.
      <br /><br />
      Technical work is full of advice: best practices, frameworks, methodologies, and patterns. The challenge isn't finding them. The challenge is understanding <em>when</em> they apply and <em>why</em> they matter in your specific situation.
      <br /><br />
      This knowledge base offers something different: structured, searchable insights that explain not just <em>what</em> techniques exist, but <em>when</em> they're valuable and <em>what trade-offs</em> they involve. Think of it as a reference library built by practitioners, for practitioners. Whether you're debugging your first merge conflict or architecting systems for a distributed team, there is something for you here.
      <br /><br />
      We don't prescribe solutions. We help you build judgment by showing how concepts, practices, and mental models apply across contexts. Your situation is unique. Your approach should be, too.
  section2:
    title: What makes this different
    subtitle: pattern-based knowledge, not prescriptive playbooks
    image: sense_making_meta_model
    features:
    - title: Contextual guidance
      text: Every practice and concept includes when to apply it, what forces enable or resist it, and what trade-offs you'll face. You'll understand not just the technique, but the situation it's built for.
    - title: Jargon decoded
      text: Technical conversations are full of shorthand. Our glossary and primers translate specialized terms into plain language, so you can follow discussions and contribute with confidence.
    - title: Curated, not exhaustive
      text: We don't catalog every framework. Instead, we share practical insights drawn from real work, backed by recommended resources when you want to dig deeper.
  section3:
    title: Start exploring
    subtitle: pick a path that matches where you are now
    text: >
      Whether you're onboarding to a new role, leading a team through a transition, or just curious how experienced practitioners approach common challenges, you'll find structured guidance here.
      <br /><br />
      <strong>New to a specific technology?</strong> Explore <a href="/primers">Primers</a> to understand the philosophy and "point" of different programming languages and tools, then dive into <a href="/concepts">Concepts</a> that shape how experienced professionals think about problems.
      <br /><br />
      <strong>Looking for actionable techniques?</strong> Browse <a href="/practices">Practices</a> to find structured approaches you can apply immediately, complete with trade-off analysis and real-world context.
      <br /><br />
      <strong>Need to decode a term or framework?</strong> Check the <a href="/glossary">Glossary</a> for plain-language definitions, or visit <a href="/books">Bibliography</a> for recommended deep dives.
      <br /><br />
      <strong>Want to understand the methodology?</strong> Read the <a href="/about">Approach</a> page for details on pattern languages, the sense-making meta model, and how this library integrates with other frameworks.
      <br /><br />
      There's no required reading order. Jump in where your curiosity leads, and follow the links between related ideas.
    links:
      - text: Concepts
        link: "/concepts"
      - text: Practices
        link: "/practices"
      - text: Primers
        link: "/primers"

