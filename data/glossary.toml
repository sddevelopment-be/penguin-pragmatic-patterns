Evaluation is a structured review of evidence, outcomes, and assumptions to determine the merit or effectiveness of an initiative. It compares observed results against intended goals to inform adjustments and next steps.
"""
aliases = ["assessment", "appraisal"]
references = []

[[terminology]]
name = "Complexity"
abbreviation = ""
domain = "systems theory, decision-making, leadership"
description = """
Complexity refers to the state or quality of a system or environment that has multiple interconnected and interdependent parts, making it difficult
to predict outcomes or behaviors. In a business or organizational context, it often involves dealing with uncertainty, ambiguity, and dynamic
interactions.
"""
aliases = ["intricacy", "complicatedness"]
references = [
]

[[terminology]]
name = "Continuous Improvement"
abbreviation = ""
domain = "quality management, process improvement"
description = """
Continuous improvement is an ongoing effort to enhance products, services, or processes by making small, incremental changes over time. It is a
fundamental concept in quality management methodologies like Lean and Kaizen, aiming to boost efficiency and reduce waste.
"""
aliases = ["incremental improvement", "process optimization", "Kaizen"]
references = [
    { title = "Continuous Improvement Definition", link = "https://asq.org/quality-resources/continuous-improvement" }
]

[[terminology]]
name = "Cognitive Load"
abbreviation = ""
domain = "cognitive science"
description = """
Cognitive load refers to the amount of mental effort required to process information or complete a task. It can be influenced by factors such as
task complexity, the individual's working memory capacity, and the design of learning materials or environments.
In knowledge work, cognitive load refers to the strain imposed by juggling too many tasks, decisions, or pieces of information simultaneously.
High cognitive load reduces focus, increases errors, and slows down decision-making.
"""
aliases = ["mental load", "cognitive effort"]
references = [
    { title = "Cognitive Load Theory", link = "https://www.instructionaldesign.org/theories/cognitive-load/" }
]

[[terminology]]
name = "Value Stream"
abbreviation = ""
domain = "Software Architecure"
description = """
A Value Stream is a sequence of interrelated activities and processes that collectively enable an organization to deliver its core products or services. Drawing on concepts from frameworks such as ArchiMate and SAFe, it represents the flow of value from the initial request or input through to the final delivery, ensuring that every step contributes to the organization’s strategic objectives. This holistic view helps identify inefficiencies, optimize workflows, and continuously enhance the overall effectiveness of business operations.
"""
aliases = []
references = [
]

[[terminology]]
name = "Progressive Disclosure"
abbreviation = ""
domain = "User Experience, Technical Communication"
description = """
A content design and usability principle where information is presented gradually, revealing complexity only when necessary. This approach improves user comprehension by preventing cognitive overload, ensuring that users receive only the most relevant details at each stage of interaction.
"""
aliases = ["Incremental Information Disclosure"]
references = [
    { title = "Nielsen Norman Group: Progressive Disclosure", link = "https://www.nngroup.com/articles/progressive-disclosure/" }
]

[[terminology]]
name = "Persona"
abbreviation = ""
domain = "User Experience, Content Strategy"
description = """
A fictional but research-based representation of a target audience segment, capturing key characteristics such as demographics, goals, motivations, and pain points. Personas help guide content development, ensuring that communication is tailored to real-world user needs.
"""
aliases = ["User Persona", "Customer Persona"]
references = [
    { title = "Cooper: The Origin of Personas", link = "https://urbanmobilitycourses.eu/wp-content/uploads/2020/08/cooper.com-The-origin-of-personas.pdf" }
]

[[terminology]]
name = "Segmentation"
abbreviation = ""
domain = "Marketing, Technical Communication"
description = """
The process of dividing a broader audience into distinct groups based on shared characteristics such as expertise level, interests, or needs. In content strategy, segmentation allows for more targeted communication, ensuring that different user groups receive the most relevant information.
"""
aliases = ["Audience Segmentation", "Market Segmentation"]
references = [
    { title = "Wikipedia: market segmentation", link = "https://en.wikipedia.org/wiki/Market_segmentation" }
]

[[terminology]]
name = "Orthogonality"
abbreviation = ""
domain = "Software Engineering, System Design"
description = """
A design principle where components or concerns are independent of one another, such that changes in one do not affect the others. Orthogonal systems are easier to understand, test, and maintain, as each part can be modified or replaced without unintended side effects on unrelated parts.
"""
aliases = ["Design Independence", "Separation of Concerns"]
references = [
    { title = "The Pragmatic Programmer", link = "https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/" },
    { title = "Wikipedia: Orthogonality in Programming", link = "https://en.wikipedia.org/wiki/Orthogonality_(programming)" }
]

[[terminology]]
name = "Connascence"
abbreviation = ""
domain = "Software Engineering, Code Quality"
description = """
A metric and conceptual model for evaluating how tightly two parts of a system are coupled, based on the types of changes in one component that would require changes in another. Lower degrees of connascence indicate better modularity and maintainability, while higher degrees signal stronger and often more brittle dependencies.
"""
aliases = ["Code Coupling", "Change Affinity"]
references = [
    { title = "Connascence by Meilir Page-Jones", link = "http://www.connascence.io/" },
    { title = "Wikipedia: Connascence", link = "https://en.wikipedia.org/wiki/Connascence_(software)" }
]

[[terminology]]
name = "Cold Shelf"
abbreviation = ""
domain = "productivity, task management"
description = """
A designated backlog or list where paused, deprioritised, or inactive tasks are temporarily placed.
The Cold Shelf helps keep current focus areas clean and intentional, without deleting or losing track of tasks that may regain relevance later.
It serves as a low-friction holding zone for items not currently in motion.
"""
aliases = ["paused tasks", "task freezer", "parking lot", "fridge"]
references = []

[[terminology]]
