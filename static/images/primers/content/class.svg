link Task to Status--><path d="M77,120.35 C77,138.11 77,157.61 77,174.74 " fill="none" id="Task-&gt;Status" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="77,179.97,81,170.97,77,174.97,73,170.97,77,179.97" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[a48230a1c2f7603cda179be78d021233]
@startuml
class Task {
  - id: UUID
  - name: String
  - status: Status
  + complete(): void
  + isPending(): boolean
}

enum Status {
  PENDING
  IN_PROGRESS
  COMPLETED
}

Task - -> Status
@enduml

