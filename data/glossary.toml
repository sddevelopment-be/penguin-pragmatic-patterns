references = [
    { title = "How to Quantify Resume Accomplishments", link = "https://www.indeed.com/career-advice/resumes-cover-letters/how-to-quantify-resume" }
]

[[terminology]]
name = "Rebutability"
abbreviation = ""
domain = "reasoning and evidence"
description = """
The quality of a claim or conclusion that makes it open to challenge or disproof. Rebuttable statements are grounded in specific evidence or measurement, making them falsifiable and useful in decision-making.
"""
aliases = ["falsifiability", "challengeability"]
references = [
