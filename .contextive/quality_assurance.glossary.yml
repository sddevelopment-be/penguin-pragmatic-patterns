contexts:
- name: Quality Assurance
  domainVisionStatement: Quality assurance ensures that products and services meet
    required standards and expectations.
  meta:
    👥 Owner: Patterns Team
  terms:
  - name: Shift Left
    definition: The practice of moving testing, analysis, and defect detection earlier
      in the lifecycle of automated processes. Rather than waiting for later stages
      -- such as integration, deployment, or delivery -- to uncover issues, teams
      integrate quality checks and automated testing right from the design and development
      phases. This proactive approach minimizes the cost and complexity of fixing
      defects, reduces the risk of operational issues, and ultimately contributes
      to a more stable, high-quality product. It embodies a culture where continuous
      feedback and early warning mechanisms, such as those provided by Canary, enable
      swift remediation and improve overall process efficiency.
  - name: Testing
    definition: Testing exercises a system to discover whether it behaves as intended,
      exposes defects, or regresses after change. Effective testing blends automation
      and exploration to build confidence in releases.
    aliases:
    - quality testing
    - software testing
