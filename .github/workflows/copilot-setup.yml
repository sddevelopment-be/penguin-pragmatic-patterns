name: Copilot Environment Validation

# This workflow validates the Hugo build environment setup
# It can be run manually to verify the composite action works correctly
# Uses: .github/actions/setup-hugo (the reusable composite action)
on:
  workflow_dispatch:
    inputs:
      run-tests:
        description: 'Run build and server tests'
        required: false
        type: boolean
        default: true

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Hugo Environment
        uses: ./.github/actions/setup-hugo
        with:
          hugo-version: '0.152.2'
          install-dart-sass: 'true'
          install-node-deps: 'true'
      
      - name: Verify Hugo build
        if: inputs.run-tests
        run: |
          hugo --gc --minify --buildDrafts=false
          FILE_COUNT=$(find public -type f | wc -l)
          echo "✓ Build successful - ${FILE_COUNT} files generated"
      
      - name: Test Hugo server
        if: inputs.run-tests
        run: |
          timeout 10 hugo server --bind 0.0.0.0 || echo "✓ Server test complete"
      
      - name: Display environment summary
        run: |
          echo "## Environment Setup Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Hugo version:** $(hugo version)" >> $GITHUB_STEP_SUMMARY
          echo "**Dart Sass version:** $(sass --version)" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js version:** $(node --version 2>/dev/null || echo 'Not installed')" >> $GITHUB_STEP_SUMMARY
          if [ -d "public" ]; then
            echo "**Build output:** $(find public -type f | wc -l) files in public/" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage in Workflows" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "- name: Setup Hugo Environment" >> $GITHUB_STEP_SUMMARY
          echo "  uses: ./.github/actions/setup-hugo" >> $GITHUB_STEP_SUMMARY
          echo "  with:" >> $GITHUB_STEP_SUMMARY
          echo "    hugo-version: '0.152.2'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quick Commands" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Build site" >> $GITHUB_STEP_SUMMARY
          echo "hugo --gc --minify --buildDrafts=false" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Start development server" >> $GITHUB_STEP_SUMMARY
          echo "hugo server --bind 0.0.0.0" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
