contexts:
- name: Cognitive Science
  domainVisionStatement: This domain encompasses specialized terminology and concepts
    used in professional practice.
  meta:
    👥 Owner: Patterns Team
  terms:
  - name: Adaptive Thinking
    definition: 'Adaptive thinking refers to the ability to adjust one''s thought
      processes in response to changing circumstances, new information, or evolving

      challenges. It involves flexibility, creativity, and the capacity to develop
      new strategies or approaches to solve problems in dynamic environments.'
    aliases:
    - cognitive flexibility
    - situational thinking
  - name: Cognitive Load
    definition: 'Cognitive load refers to the amount of mental effort required to
      process information or complete a task. It can be influenced by factors such
      as

      task complexity, the individual''s working memory capacity, and the design of
      learning materials or environments.

      In knowledge work, cognitive load refers to the strain imposed by juggling too
      many tasks, decisions, or pieces of information simultaneously.

      High cognitive load reduces focus, increases errors, and slows down decision-making.'
    aliases:
    - mental load
    - cognitive effort
    examples:
    - 'See: [Cognitive Load Theory](https://www.instructionaldesign.org/theories/cognitive-load/)
      for more details.'
  - name: Cognitive agency
    definition: The capacity of a person or system to perceive, interpret, and act
      based on knowledge, goals, and intent. In humans, cognitive agency involves
      self-directed reasoning, planning, and decision-making. In organizational or
      AI contexts, it refers to the ability to independently pursue objectives with
      adaptive intelligence.
    aliases:
    - mental autonomy
    - reasoning agency
    examples:
    - 'See: [Agency in Cognitive Science](https://en.wikipedia.org/wiki/Agency_(philosophy))
      for more details.'
    - 'See: [What Is Agency?](https://plato.stanford.edu/entries/agency/) for more
      details.'
