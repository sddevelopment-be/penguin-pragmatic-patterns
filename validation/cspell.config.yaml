  - HEXACO
  - scrum
  - MBTI
  - OKR
  - Structurizr
  - webp
  - docsify
  - Zibaldone
  - holistic
  - S2ophia
  - license
  - changelog
  - biblio
  - pubdate
  - Ikigai
  - connascence
  - gustinsi
  - openrewrite
  - devpedia
  - Doji
  - practicingruby
  - Rebutability
  - challengeability
  - deprioritised
  - slidedeck
  - holacracy
  - subfacet
  - habbits
  - resumés
ignorePaths:
