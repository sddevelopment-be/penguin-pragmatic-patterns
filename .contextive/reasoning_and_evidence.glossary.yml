  - name: Rebutability
    definition: The quality of a claim or conclusion that makes it open to challenge
      or disproof. Rebuttable statements are grounded in specific evidence or measurement,
      making them falsifiable and useful in decision-making.
    aliases:
    - falsifiability
    - challengeability
    examples:
    - 'Reference: Turn the Ship Around'
