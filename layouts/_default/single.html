{{ define "main" }}
<main id="main-content" class="site-main" role="main" tabindex="-1">
{{ partial "navbar.html" . }}
{{ partial "navbar-clone.html" . }}

{{ partial "title-section.html" . }}

<section class="section is-medium">
    <div class="container">
        <div class="content">
            {{ .Content }}
        </div>
    </div>
</section>

{{ if .Site.Params.footer }}
    {{ partial "footer.html" . }}
{{ end }}
</main>
{{ end }}
