  terms:
  - name: Objectives and Key Results
    definition: 'A goal-setting framework used to align individual and team efforts
      with broader organisational priorities.

      Each Objective defines a qualitative direction or ambition, while its associated
      Key Results describe specific, measurable outcomes used to track progress.

      OKRs encourage transparency, focus, and outcome-driven planning across all levels
      of an organisation.'
    aliases:
    - OKRs
    - goal alignment framework
    - outcome tracking
    examples:
    - 'See: [What are Objectives and Key Results (OKRs)?](https://www.ibm.com/think/topics/okrs)
      for more details.'
    - 'See: [Measure What Matters](https://www.goodreads.com/book/show/39286958-measure-what-matters)
      for more details.'
