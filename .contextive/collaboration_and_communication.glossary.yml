  terms:
  - name: conflict
    definition: A state of tension or disagreement between individuals or groups,
      often arising from misaligned goals, values, or interpretations. Conflict is
      not inherently negative; when handled constructively, it can surface important
      issues, improve decisions, and build trust. Effective conflict resolution involves
      curiosity, structured dialogue, and a shared commitment to progress.
    aliases:
    - disagreement
    - tension
    - interpersonal conflict
  - name: feedback culture
    definition: A shared team or organizational norm that encourages timely, constructive,
      and reciprocal feedback. A strong feedback culture supports psychological safety,
      continuous improvement, and personal growth. It balances honesty with care and
      treats feedback as a regular practice — not just a performance tool.
    aliases:
    - feedback loop
    - constructive feedback
    - feedback environment
    examples:
    - 'See: [Radical Candor by Kim Scott](https://www.radicalcandor.com/) for more
      details.'
