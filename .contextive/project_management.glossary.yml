contexts:
- name: Project Management
  domainVisionStatement: This domain encompasses specialized terminology and concepts
    used in professional practice.
  meta:
    👥 Owner: Patterns Team
  terms:
  - name: Collaboration
    definition: Collaboration is the process of working together as a team to achieve
      common goals in a project. It involves effective communication, sharing of knowledge,
      and coordination among team members, often facilitated by tools and practices
      that support teamwork, such as version control systems, project management platforms,
      and collaborative documentation.
    examples:
    - 'See: [Effective Collaboration in Project Management](https://www.pmi.org/learning/library/effective-collaboration-project-teams-11639)
      for more details.'
  - name: Knowledge Retention
    definition: Knowledge retention refers to the practice of capturing, storing,
      and managing information or knowledge within a project or organization to ensure
      that it remains accessible and usable in the future. This process is crucial
      for maintaining continuity, especially when team members leave or transition
      between roles, ensuring that valuable insights and data are not lost.
    examples:
    - 'See: [Knowledge Retention Strategies](https://www.apqc.org/resource-library/resource-listing/knowledge-retention-strategies)
      for more details.'
  - name: Traceability
    definition: Traceability is the ability to link project artifacts, such as requirements,
      design elements, code, and test cases, to their corresponding outcomes or deliverables.
      It ensures that every change or decision made during a project's lifecycle can
      be traced back to its origin, providing transparency, accountability, and the
      ability to verify that all requirements have been met.
    aliases:
    - Requirements Traceability
    examples:
    - 'See: [Requirements Traceability](https://www.incose.org/docs/default-source/enchantment/requirements-traceability.pdf)
      for more details.'
