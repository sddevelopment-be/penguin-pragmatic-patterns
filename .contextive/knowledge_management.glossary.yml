  - name: Zibaldone
    definition: An eclectic personal notebook or commonplace book used to collect
      thoughts, quotes, observations, and ideas. Originating from the Italian word
      for “heap of things,” a zibaldone is a private, unstructured record of personal
      knowledge — often used as a thinking aid, reference archive, or creative incubator.
    aliases:
    - commonplace book
    - idea journal
    - thinking notebook
    examples:
