  - name: mentorship
    definition: A developmental relationship in which a more experienced individual
      supports the learning, confidence, and capability-building of a less experienced
      peer. Mentorship can be formal or informal and often includes guidance, encouragement,
      and honest reflection. It plays a key role in skill development, knowledge transfer,
      and shaping professional identity.
