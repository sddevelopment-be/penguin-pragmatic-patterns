contexts:
- name: Software Engineering
  domainVisionStatement: This domain encompasses specialized terminology and concepts
    used in professional practice.
  meta:
    👥 Owner: Patterns Team
  terms:
  - name: Connascence
    definition: A metric and conceptual model for evaluating how tightly two parts
      of a system are coupled, based on the types of changes in one component that
      would require changes in another. Lower degrees of connascence indicate better
      modularity and maintainability, while higher degrees signal stronger and often
      more brittle dependencies.
    aliases:
    - Code Coupling
    - Change Affinity
    examples:
    - 'See: [Connascence by Meilir Page-Jones](http://www.connascence.io/) for more
      details.'
    - 'See: [Wikipedia: Connascence](https://en.wikipedia.org/wiki/Connascence_(software))
      for more details.'
  - name: Orthogonality
    definition: A design principle where components or concerns are independent of
      one another, such that changes in one do not affect the others. Orthogonal systems
      are easier to understand, test, and maintain, as each part can be modified or
      replaced without unintended side effects on unrelated parts.
    aliases:
    - Design Independence
    - Separation of Concerns
    examples:
    - 'See: [The Pragmatic Programmer](https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/)
      for more details.'
    - 'See: [Wikipedia: Orthogonality in Programming](https://en.wikipedia.org/wiki/Orthogonality_(programming))
      for more details.'
