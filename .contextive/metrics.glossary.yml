  terms:
  - name: Goodhart's Law
    definition: A principle stating that when a metric is used as a target for decision-making,
      it tends to lose its effectiveness as a measure. Once people begin optimising
      for the metric itself, they may distort behaviour in ways that undermine the
      original goal.
    aliases:
    - metric manipulation
    - KPI dysfunction
    examples:
    - 'See: [Goodhart''s Law](https://en.wikipedia.org/wiki/Goodhart%27s_law) for
      more details.'
