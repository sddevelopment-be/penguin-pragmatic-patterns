  terms:
  - name: Cold Reading
    definition: A technique used to make high-probability guesses about someone’s
      background or personality without prior knowledge, often by observing cues and
      using general statements. Common in pseudoscience and performance (e.g. psychics,
      mediums), cold reading exploits confirmation bias and the Barnum Effect to appear
      insightful or prophetic.
    aliases:
    - psychic reading
    - persuasive guessing
    examples:
    - 'See: [Cold Reading](https://en.wikipedia.org/wiki/Cold_reading) for more details.'
