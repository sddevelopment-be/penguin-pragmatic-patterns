  - name: Placating
    definition: 'A conflict-avoidant behavior where someone attempts to appease others
      or defuse tension by agreeing, apologizing, or giving in; often at the cost
      of their own needs or honesty.

      Placating can appear kind but may undermine trust, clarity, or long-term collaboration
      when used manipulatively or habitually.'
    aliases:
    - appeasement
    - passive compliance
