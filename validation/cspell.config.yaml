version: "0.2"
language: en-GB
locale: en-GB,nl
useGitignore: true
dictionaries:
  - en-gb-oxendict
  - en-gb
  - en
  - proper-names
  - tooling-terms
  - acronyms
  - narratives
dictionaryDefinitions:
  - name: proper-names
    path: ./dictionaries/proper-names.txt
    addWords: true
  - name: tooling-terms
    path: ./dictionaries/tooling-terms.txt
    addWords: true
  - name: acronyms
    path: ./dictionaries/acronyms.txt
