contexts:
- name: User Experience
  domainVisionStatement: This domain encompasses specialized terminology and concepts
    used in professional practice.
  meta:
    👥 Owner: Patterns Team
  terms:
  - name: Persona
    definition: A fictional but research-based representation of a target audience
      segment, capturing key characteristics such as demographics, goals, motivations,
      and pain points. Personas help guide content development, ensuring that communication
      is tailored to real-world user needs.
    aliases:
    - User Persona
    - Customer Persona
    examples:
    - 'See: [Cooper: The Origin of Personas](https://urbanmobilitycourses.eu/wp-content/uploads/2020/08/cooper.com-The-origin-of-personas.pdf)
      for more details.'
  - name: Progressive Disclosure
    definition: A content design and usability principle where information is presented
      gradually, revealing complexity only when necessary. This approach improves
      user comprehension by preventing cognitive overload, ensuring that users receive
      only the most relevant details at each stage of interaction.
    aliases:
    - Incremental Information Disclosure
    examples:
    - 'See: [Nielsen Norman Group: Progressive Disclosure](https://www.nngroup.com/articles/progressive-disclosure/)
      for more details.'
