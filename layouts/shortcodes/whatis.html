{{ $text := .Get "text" }}
{{ $title := .Get "title" }}

<div class="alert-container small-padding">
    <blockquote class="groucho muted whatis">
        <span class="muted-title">{{if $title }} {{ $title }} {{ else }} What is this? {{ end }} <br /> </span>
        {{ $text | markdownify }}
    </blockquote>
</div>
